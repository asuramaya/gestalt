name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Order matters: the structure gate runs FIRST, before any build step
      # (REPO-STANDARD.md §3 — placing it after a build step let a bad root
      # ship on a real runner once already).
      - name: Repo structure gate (REPO-STANDARD.md)
        run: make check-repo

      - name: check-sutra (vendored commons integrity)
        run: make check-sutra

      - name: check-pill-js (vendored extension commons integrity)
        run: make check-pill-js

      - name: check-vendored-path (gestaltctl resolves the checkout's own sutra)
        run: make check-vendored-path-all

      # numpy, and only numpy, ahead of check-py: packaging/packages.txt
      # declares it a genuine gestalt runtime dep (pointing/'s own filtering,
      # plus a transitive dep of mediapipe/opencv anyway) -- gestaltd cannot
      # run without it, so installing it here is honest, not a workaround.
      # "hardware-free" (no camera/display/uinput) and "dependency-free" are
      # different claims; conflating them is exactly what made this step
      # silently rely on numpy already being on the runner's dist-packages
      # in dev sandboxes while failing clean on ubuntu-latest CI (run
      # 30716789389, on fa2297a, has never been green). The rest of
      # packages.txt (mediapipe/opencv/pygame/evdev/python-xlib) stays out:
      # those are install.sh's venv for the daemon itself, and no test here
      # touches that code.
      - name: Install numpy (a real gestalt runtime dep, needed to import gestalt.pointing)
        run: pip install numpy

      - name: Python compiles + lint + hardware-free tests (numpy required)
        run: make check-py

      - name: Shell scripts parse + shellcheck
        run: make check-shell

      - name: Extension JS compiles + metadata parses
        run: make check-js
