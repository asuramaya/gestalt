name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION, and gestaltd actually resolves it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < packaging/VERSION)"
          echo "tag=${tag} VERSION=${file}"
          if [ "${tag}" != "${file}" ]; then
            echo "::error::tag ${tag} does not match VERSION ${file}"
            exit 1
          fi
          # gestaltd has no version literal of its own to drift (see
          # docs/ARCHITECTURE.md): daemon_version() resolves the same
          # VERSION file this checkout ships. Prove that live, from a fresh
          # checkout, rather than grepping for a constant that doesn't exist.
          daemon="$(cd src/bin && python3 -c '
          import importlib.util, sys
          from importlib.machinery import SourceFileLoader
          sys.path.insert(0, ".")
          loader = SourceFileLoader("gestaltd", "gestaltd")
          spec = importlib.util.spec_from_loader(loader.name, loader)
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)
          print(mod.daemon_version())
          ')"
          echo "src/bin/gestaltd resolves VERSION to: ${daemon}"
          if [ "${file}" != "${daemon}" ]; then
            echo "::error::VERSION ${file} does not match what src/bin/gestaltd actually resolves (${daemon})"
            exit 1
          fi

      - name: Refuse to tag while the signing anchor is empty
        run: |
          # A tag's tree is exactly what `git archive` ships in the tarball
          # below -- if packaging/release-signing/allowed_signers is empty
          # AT TAG TIME, the tarball ships a permanently empty anchor,
          # forever, because a sealed release is never re-cut. Safe for a
          # pill that armed long ago (every tag since captures a populated
          # anchor) but not for a first-ever release: arming must happen
          # BEFORE the tag that ships it, never after, never bundled into
          # the seal step. See docs/RELEASING.md's three-step order (found
          # by Vajra in mudra's own doc, the only other repo exposed to
          # this — msg 2891).
          if [ ! -s packaging/release-signing/allowed_signers ]; then
            echo "::error::packaging/release-signing/allowed_signers is empty at this tag." \
                 "Arming (make sync-signers, operator's hand, their key home) must happen" \
                 "BEFORE tagging, never after. Delete this tag, arm, re-tag."
            exit 1
          fi

      - name: Build release tarball
        run: |
          # .gitattributes export-ignore keeps CI/dev files out of the tarball.
          # --prefix=gestalt/: every tarball extracts to exactly one named
          # directory, never bare into the caller's CWD.
          git archive --format=tar.gz --prefix=gestalt/ -o gestalt.tar.gz HEAD
          sha256sum gestalt.tar.gz > gestalt.tar.gz.sha256
          echo "--- contents ---"
          tar -tzf gestalt.tar.gz

      # No signing step here, deliberately: a future verifying client would
      # trust an SSH signature (ssh-keygen -Y verify) against a key pinned
      # INSIDE the client (packaging/release-signing/allowed_signers,
      # docs/RELEASE-SIGNING.md), precisely so this CI (or the GitHub account
      # behind it) is not the trust root. A secret/hardware key living in
      # Actions secrets would let anyone who compromises the account or the
      # workflow sign whatever they just pushed — that defeats the entire
      # scheme. The release ships UNSIGNED from here; the operator signs the
      # published checksum manifest's exact bytes BY HAND, offline, with the
      # physical FIDO2 key, and runs
      # `gh release upload <tag> gestalt.tar.gz.sha256.sig --clobber` after.

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unsigned assets only. Verifiers (once one exists — see
          # docs/RELEASE-SIGNING.md's known gap) fail closed until the
          # operator uploads a detached signature out of band.
          assets=(gestalt.tar.gz gestalt.tar.gz.sha256)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            # Notes come from docs/CHANGELOG.md, never --generate-notes: a
            # human wrote that entry, and a commit dump is not release notes.
            # If the section is missing, refuse the release instead of
            # falling back, so a forgotten CHANGELOG entry is loud rather
            # than silent (see docs/RELEASING.md).
            ver="${GITHUB_REF_NAME#v}"
            awk -v v="${ver}" 'BEGIN{f=0}
              /^## / { if (f) exit; if (index($0, v)) { f=1; print; next } }
              f { print }' docs/CHANGELOG.md > RELEASE_NOTES.md
            if [ ! -s RELEASE_NOTES.md ]; then
              echo "::error::no docs/CHANGELOG.md section for ${ver}; add one before tagging"
              exit 1
            fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "gestalt ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi
